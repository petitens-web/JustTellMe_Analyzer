<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>JusTelMi PVT Analyzer — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0a0e17;
  --surface: #111825;
  --card: #161e2e;
  --accent: #00d4aa;
  --accent2: #0084ff;
  --warn: #ff6b35;
  --text: #e8edf5;
  --muted: #6b7a99;
  --border: rgba(255,255,255,0.07);
  --glow: 0 0 40px rgba(0,212,170,0.15);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'IBM Plex Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
  overflow:hidden;
  position:relative;
}

/* animated grid bg */
body::before{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(0,212,170,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,170,0.04) 1px, transparent 1px);
  background-size:48px 48px;
  animation:gridMove 20s linear infinite;
  pointer-events:none;
}
@keyframes gridMove{
  0%{background-position:0 0;}
  100%{background-position:48px 48px;}
}

.orb{
  position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;
  animation:orbFloat 8s ease-in-out infinite;
}
.orb1{width:400px;height:400px;background:rgba(0,212,170,0.12);top:-100px;right:-100px;}
.orb2{width:300px;height:300px;background:rgba(0,132,255,0.1);bottom:-80px;left:-80px;animation-delay:-4s;}

@keyframes orbFloat{
  0%,100%{transform:translate(0,0);}
  50%{transform:translate(20px,20px);}
}

.login-wrap{
  position:relative;z-index:10;
  width:100%;max-width:440px;
  padding:1rem;
  animation:fadeUp 0.7s cubic-bezier(0.22,1,0.36,1);
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(24px);}
  to{opacity:1;transform:translateY(0);}
}

.logo-area{text-align:center;margin-bottom:2.5rem;}
.logo-icon{
  width:56px;height:56px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-radius:14px;
  display:inline-flex;align-items:center;justify-content:center;
  font-family:'Syne',sans-serif;font-weight:800;font-size:1.1rem;
  color:#0a0e17;margin-bottom:1rem;
  box-shadow:0 0 30px rgba(0,212,170,0.3);
}
.logo-name{
  font-family:'Syne',sans-serif;font-weight:800;font-size:1.7rem;
  letter-spacing:-0.02em;color:var(--text);
}
.logo-name span{color:var(--accent);}
.logo-sub{
  font-family:'IBM Plex Mono',monospace;font-size:0.68rem;
  color:var(--muted);letter-spacing:0.18em;margin-top:0.3rem;
  text-transform:uppercase;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:2.5rem 2.5rem 2rem;
  box-shadow:0 24px 80px rgba(0,0,0,0.5), var(--glow);
}

.card-title{
  font-family:'Syne',sans-serif;font-weight:700;font-size:1.15rem;
  margin-bottom:0.3rem;color:var(--text);
}
.card-sub{font-size:0.82rem;color:var(--muted);margin-bottom:2rem;}

.field{margin-bottom:1.2rem;}
label{
  display:block;font-size:0.72rem;font-weight:500;
  color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;
  margin-bottom:0.5rem;
}

.input-wrap{position:relative;}
.input-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:15px;color:var(--muted);pointer-events:none;
}
input[type=email],input[type=password]{
  width:100%;padding:12px 14px 12px 42px;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--text);
  font-family:'IBM Plex Sans',sans-serif;font-size:0.92rem;
  outline:none;transition:border-color 0.2s,box-shadow 0.2s,background 0.2s;
}
input:focus{
  border-color:var(--accent);
  background:rgba(0,212,170,0.05);
  box-shadow:0 0 0 3px rgba(0,212,170,0.12);
}
input::placeholder{color:var(--muted);}

.btn-primary{
  width:100%;padding:13px;
  background:linear-gradient(135deg,var(--accent),#00b890);
  border:none;border-radius:10px;
  color:#0a0e17;font-family:'Syne',sans-serif;font-weight:700;font-size:0.95rem;
  cursor:pointer;margin-top:0.5rem;
  transition:opacity 0.2s,transform 0.15s,box-shadow 0.2s;
  box-shadow:0 4px 20px rgba(0,212,170,0.3);
  letter-spacing:0.03em;
}
.btn-primary:hover{opacity:0.9;transform:translateY(-1px);box-shadow:0 8px 30px rgba(0,212,170,0.4);}
.btn-primary:active{transform:scale(0.98);}

.divider{
  display:flex;align-items:center;gap:12px;
  margin:1.5rem 0;
}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
.divider span{font-size:0.72rem;color:var(--muted);white-space:nowrap;}

.btn-google{
  width:100%;padding:12px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);border-radius:10px;
  color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:0.88rem;font-weight:500;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
  transition:background 0.2s,border-color 0.2s,transform 0.15s;
}
.btn-google:hover{background:rgba(255,255,255,0.09);border-color:rgba(255,255,255,0.15);transform:translateY(-1px);}
.btn-google svg{flex-shrink:0;}

.err{
  font-size:0.78rem;color:#ff6b6b;margin-top:0.4rem;display:none;
}

.footer-note{
  text-align:center;margin-top:1.5rem;
  font-size:0.75rem;color:var(--muted);
  font-family:'IBM Plex Mono',monospace;
}

.tag{
  display:inline-block;
  background:rgba(0,212,170,0.1);
  color:var(--accent);
  font-family:'IBM Plex Mono',monospace;
  font-size:0.6rem;letter-spacing:0.1em;
  padding:3px 8px;border-radius:4px;border:1px solid rgba(0,212,170,0.2);
  margin-bottom:1.5rem;
}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="login-wrap">
  <div class="logo-area">
    <div class="logo-icon">JT</div>
    <div class="logo-name"><span>JusTelMi</span> PVT</div>
    <div class="logo-sub">Petroleum Fluid Analysis Platform</div>
  </div>

  <div class="card">
    <div class="tag">SECURE ACCESS</div>
    <div class="card-title">Sign in to your account</div>
    <div class="card-sub">Enter your credentials to access the PVT analyzer</div>

    <div class="field">
      <label>Email address</label>
      <div class="input-wrap">
        <span class="input-icon">✉</span>
        <input type="email" id="emailInput" placeholder="you@gmail.com" autocomplete="email"/>
      </div>
      <div class="err" id="emailErr">Please enter a valid email.</div>
    </div>

    <div class="field">
      <label>Password</label>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input type="password" id="passInput" placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <div class="err" id="passErr">Password must be at least 6 characters.</div>
    </div>

    <button class="btn-primary" onclick="handleLogin()">Sign In →</button>

    <div class="divider"><span>or continue with</span></div>

    <button class="btn-google" onclick="handleGoogleLogin()">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>
  </div>

  <div class="footer-note">v1.0.0 · JusTelMi PVT Analyzer · Reservoir Engineering Tool</div>
</div>

<script>
function handleLogin(){
  const email = document.getElementById('emailInput').value.trim();
  const pass = document.getElementById('passInput').value;
  const emailErr = document.getElementById('emailErr');
  const passErr = document.getElementById('passErr');
  let valid = true;

  emailErr.style.display = 'none';
  passErr.style.display = 'none';

  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    emailErr.style.display = 'block'; valid = false;
  }
  if(pass.length < 6){
    passErr.style.display = 'block'; valid = false;
  }
  if(valid){
    localStorage.setItem('pvt_user', email);
    window.location.href = 'app_4.html';
  }
}

function handleGoogleLogin(){
  localStorage.setItem('pvt_user', 'user@gmail.com');
  window.location.href = 'app_4.html';
}

document.addEventListener('keydown', e => {
  if(e.key === 'Enter') handleLogin();
});
</script>
</body>
</html>
